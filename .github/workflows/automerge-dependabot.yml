# Automatically merges Dependabot PRs that match the rules in .github/auto-merge.yml,
# after all other checks have passed.

name: Auto-Merge Dependabot PRs

on:
  # Runs in the context of the base branch. Do not check out or build PR code in this workflow.
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge Dependabot PRs
        uses: iobroker-bot-orga/action-automerge-dependabot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash
          wait-for-checks: 'true'
