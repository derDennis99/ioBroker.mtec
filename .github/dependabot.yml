version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "5 0 15 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    cooldown:
      default-days: 7
    assignees:
      - derDennis99
    versioning-strategy: increase
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "5 0 15 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - derDennis99
